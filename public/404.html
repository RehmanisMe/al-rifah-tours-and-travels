<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Al Rifah Travels Pvt Ltd</title>
    <meta name="robots" content="noindex">

    <!-- Favicons / App Icons -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1a1a2e">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #008080;
            --gold: #B8860B;
            --gold-light: #DAA520;
            --dark: #1a1a2e;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--dark);
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            text-align: center;
        }

        .error-logo {
            width: 260px;
            max-width: 80vw;
            height: auto;
            margin: 0 auto 32px;
            /* The artwork sits on solid black; "screen" drops that black away
               so the gold blends onto the dark page background. */
            mix-blend-mode: screen;
        }

        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 700;
            line-height: 1;
            color: var(--gold);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 400;
            color: #fff;
            margin-bottom: 14px;
        }

        p {
            font-size: 0.95rem;
            max-width: 460px;
            margin: 0 auto 32px;
            color: rgba(255, 255, 255, 0.65);
        }

        .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary { background: var(--gold); color: #fff; }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); }

        .btn-outline { border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>
    <main>
        <img src="assets/images/logo-al-rifah-travels.png" alt="Al Rifah Travels Pvt Ltd" class="error-logo" width="818" height="439">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for may have been moved or no longer exists. Let us guide you back to your journey.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/umrah-cost-calculator.html" class="btn btn-outline">Umrah Cost Calculator</a>
        </div>
    </main>
</body>
</html>
